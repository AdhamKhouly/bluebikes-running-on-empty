name: Log Bluebikes station status

on:
  schedule:
    - cron: "0 * * * *"      # hourly request; GitHub actually starts ~4 runs/day
  workflow_dispatch:         # lets you trigger it by hand

permissions:
  contents: write

concurrency:
  group: gbfs-logger
  cancel-in-progress: false  # if GitHub starts a run while one is going, queue it

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # GitHub's hard cap is 360
    env:
      SNAPSHOTS: "33"        # 33 snapshots × 10 min ≈ 5.5 h of coverage per run
      INTERVAL_SEC: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python logger.py
      - name: Commit new data
        if: always()         # commit whatever was logged, even if the job is cancelled or times out
        run: |
          git config user.name "gbfs-logger"
          git config user.email "gbfs-logger@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "log: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
